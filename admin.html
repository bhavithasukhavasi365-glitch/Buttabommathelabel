
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttabomma | Product Manager</title>
<style>
body{margin:0;background:#faf7f4;color:#332b3b;font-family:Arial,sans-serif}
header{background:#dce8d4;text-align:center;padding:30px 15px}
h1{font-family:Georgia,serif;font-weight:normal}
main{max-width:1000px;margin:auto;padding:22px}
.notice{background:#fff1d6;padding:15px;border-radius:10px;margin-bottom:20px}
button{background:#413052;color:white;border:0;padding:12px 16px;border-radius:8px;cursor:pointer;margin:5px}
input{padding:10px;border:1px solid #ccc;border-radius:6px;max-width:100%;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:270px;object-fit:contain;background:#f8f6f3}
.card input{width:100%;margin:5px 0}
.actions{margin-bottom:20px}
</style>
</head>
<body>
<header>
<h1>Buttabomma The Label</h1>
<p>Product Management Dashboard</p>
</header>
<main>
<div class="notice">
Changes are saved in this browser until you download
the updated products.json file and upload it to GitHub.
</div>
<div class="actions">
<button onclick="addProduct()">+ Add Product</button>
<button onclick="downloadProducts()">Download Updated Products</button>
<button onclick="loadProducts()">Reload Published Products</button>
</div>
<div id="status"></div>
<div id="products" class="grid"></div>
</main>
<script>
let products=[];

async function loadProducts(){
 try{
  const response=await fetch("products.json?time="+Date.now());
  if(!response.ok)throw Error("File not found");
  const data=await response.json();
  products=Array.isArray(data)?data:
    (Array.isArray(data.products)?data.products:[]);
  render();
  document.getElementById("status").textContent=
    "Loaded "+products.length+" products.";
 }catch(e){
  document.getElementById("status").textContent=
    "Unable to load products.json. Check that it is published.";
 }
}

function addProduct(){
 products.push({
  id:Date.now(),
  name:"New Product",
  price:0,
  sizes:"XS-XXL",
  stock:1,
  image:"product-new.jpg"
 });
 render();
}

function updateField(i,key,value){
 products[i][key]=
  (key==="price"||key==="stock")?
  Number(value):value;
}

function removeProduct(i){
 if(confirm("Remove this product?")){
  products.splice(i,1);
  render();
 }
}

function render(){
 const area=document.getElementById("products");
 area.replaceChildren();
 products.forEach((p,i)=>{
  const card=document.createElement("div");
  card.className="card";
  const img=document.createElement("img");
  img.src=p.image||"";
  img.alt=p.name||"Product";
  img.onerror=()=>{img.style.display="none"};
  card.appendChild(img);
  ["name","price","sizes","stock","image"].forEach(key=>{
   const label=document.createElement("label");
   label.textContent=key.toUpperCase();
   const field=document.createElement("input");
   field.value=p[key]??"";
   field.type=["price","stock"].includes(key)?"number":"text";
   field.oninput=()=>updateField(i,key,field.value);
   label.appendChild(field);
   card.appendChild(label);
  });
  const del=document.createElement("button");
  del.textContent="Remove Product";
  del.onclick=()=>removeProduct(i);
  card.appendChild(del);
  area.appendChild(card);
 });
}

function downloadProducts(){
 const file=new Blob(
  [JSON.stringify(products,null,2)],
  {type:"application/json"}
 );
 const url=URL.createObjectURL(file);
 const a=document.createElement("a");
 a.href=url;
 a.download="products.json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

loadProducts();
</script>
</body>
</html>
